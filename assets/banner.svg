<path d="M616 240 H896" stroke="#ffffff" stroke-opacity="0.05"/>
<text class="lb" style="animation-delay:1.16s" x="618" y="261" font-size="14.5" fill="#d3cee6">FPS overlay</text>
<rect class="tr" style="animation-delay:1.16s" x="862" y="247" width="34" height="18" rx="9" fill="#ffdc50"/>
<circle class="k" style="animation-delay:1.16s" cx="887" cy="256" r="6.5" fill="#1b1a27"/>
<g class="chip"><rect x="732" y="270" width="196" height="28" rx="14" fill="#15161f" stroke="#ffdc50" stroke-opacity="0.6"/><text x="830" y="288.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="700" fill="#ffdc50" text-anchor="middle">60 FPS · 16.7 ms · 50 Hz</text></g>
</g>
</svg>
