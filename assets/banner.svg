<text x="638" y="66" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#a39dbb">com.mentalize.repoperformance.cfg</text>
<path d="M600 80 H912" stroke="#ffffff" stroke-opacity="0.1"/>
<text class="lb" style="animation-delay:0.50s" x="618" y="101" font-size="14.5" fill="#d3cee6">Log filter and dedupe</text>
<rect class="tr" style="animation-delay:0.50s" x="862" y="87" width="34" height="18" rx="9" fill="#ffdc50"/>
<circle class="k" style="animation-delay:0.50s" cx="887" cy="96" r="6.5" fill="#1b1a27"/>
<path d="M616 112 H896" stroke="#ffffff" stroke-opacity="0.05"/>
